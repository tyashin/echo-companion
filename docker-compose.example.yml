# Template for docker-compose.yml — copy to docker-compose.yml and fill in
# real credentials. docker-compose.yml is gitignored and must never be committed.
#
# docker-compose for local development only (Phase 0.1).
# Python apps run locally under uv during development; containers are for production.
services:
  echo_postgres:
    image: pgvector/pgvector:pg17
    container_name: echo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: echo
    volumes:
      - echo_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - echo_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echo -d echo"]
      interval: 5s
      timeout: 3s
      retries: 10

  echo_neo4j:
    image: neo4j:5-community
    container_name: echo_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/changeme
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - echo_neo4j_data:/data
    ports:
      # Host ports offset by 10000: a non-Docker Neo4j already occupies 7474/7687 on the dev PC.
      - "127.0.0.1:17474:7474"  # browser
      - "127.0.0.1:17687:7687"  # bolt
    networks:
      - echo_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  echo_internal:
    driver: bridge

volumes:
  echo_postgres_data:
  echo_neo4j_data:
